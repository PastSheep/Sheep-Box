[project]
name = "sheep-box"
version = "0.1.0"
description = "Sheep Box 项目"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rapidocr_onnxruntime==1.4.4",
    "pyyaml==6.0.3",
    "pydantic==2.14.1",
]

[project.optional-dependencies]
dev = [
    "black==26.10.1",
    "ruff==0.17.3",
    "mypy==2.4.0",
    "pre-commit==4.7.0",
    "pytest==9.2.0",
]
# GPU 加速可选后端：按部署平台二选一安装（替换默认 CPU onnxruntime）
ocr-gpu-dml = [
    "onnxruntime-directml==1.24.4",
]
ocr-gpu-cuda = [
    "onnxruntime-gpu==1.31.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["config*", "common*", "service*", "models*", "api*"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
ignore = []

[tool.mypy]
python_version = "3.10"
disallow_untyped_defs = true
check_untyped_defs = true
warn_return_any = true
ignore_missing_imports = true
exclude = ["tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
