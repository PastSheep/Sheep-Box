# Sheep Box 通用配置中心默认配置
# 路径为相对本文件所在目录（config/）的相对路径，加载时自动解析为绝对路径。

ocr:
  # 模型加载配置（必填段）
  model:
    # 默认模型模式：tiny / small / medium / all
    #   - 非 all：仅加载 default_spec 对应规格一个实例（资源占用最小）
    #   - all：同时加载全部规格
    mode: medium
    # 非 all 模式下的默认加载规格
    default_spec: medium
    # 各规格的 det/rec/cls 模型路径（必填）
    # 注：首版仅 medium 已就绪（复用 RapidOCR 内置 PP-OCRv4 模型）；
    #   tiny/small 模型待下载后放置到 assets/ocr/models/{tiny,small}/ 对应目录。
    models:
      tiny:
        det: ../assets/ocr/models/tiny/det.onnx
        rec: ../assets/ocr/models/tiny/rec.onnx
        cls: ../assets/ocr/models/tiny/cls.onnx
      small:
        det: ../assets/ocr/models/small/det.onnx
        rec: ../assets/ocr/models/small/rec.onnx
        cls: ../assets/ocr/models/small/cls.onnx
      medium:
        det: ../assets/ocr/models/medium/det.onnx
        rec: ../assets/ocr/models/medium/rec.onnx
        cls: ../assets/ocr/models/medium/cls.onnx

  # 设备配置（可选，默认关闭 GPU）
  device:
    gpu_enabled: false

  # 识别阈值（可选，默认见下）
  thresholds:
    text_score: 0.5
    box_thresh: 0.5
    unclip_ratio: 1.6

  # 识别语言（可选，中文优先）
  language: zh
