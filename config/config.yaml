# Sheep Box 通用配置中心默认配置
# 路径为相对本文件所在目录（config/）的相对路径，加载时自动解析为绝对路径。

ocr:
  # 模型加载配置（必填段）
  model:
    # 默认模型模式：tiny / small / medium / all
    #   - 非 all：仅加载 mode 对应规格一个实例（资源占用最小）
    #   - all：同时加载全部规格，生效规格取 default_spec
    mode: small
    # all 模式下的默认生效规格（非 all 时由 mode 决定档位；首版默认 small）
    default_spec: small
    # 各规格的 PP-OCRv6 模型路径（必填）：det/rec onnx + rec 字典 dict + cls onnx
    # 模型文件预置于 assets/ocr/models/{tiny,small,medium}/（不入库，部署时下载放置）
    models:
      tiny:
        det: ../assets/ocr/models/tiny/det.onnx
        rec: ../assets/ocr/models/tiny/rec.onnx
        dict_path: ../assets/ocr/models/tiny/dict.txt
        cls: ../assets/ocr/models/tiny/cls.onnx
      small:
        det: ../assets/ocr/models/small/det.onnx
        rec: ../assets/ocr/models/small/rec.onnx
        dict_path: ../assets/ocr/models/small/dict.txt
        cls: ../assets/ocr/models/small/cls.onnx
      medium:
        det: ../assets/ocr/models/medium/det.onnx
        rec: ../assets/ocr/models/medium/rec.onnx
        dict_path: ../assets/ocr/models/medium/dict.txt
        cls: ../assets/ocr/models/medium/cls.onnx

  # 识别阈值（可选，默认见下）
  thresholds:
    text_score: 0.5
    box_thresh: 0.5
    unclip_ratio: 1.6

  # 识别语言（可选，中文优先）
  language: zh

# 程序级偏好（可选，由设置界面承载）
app:
  ui_language: zh_CN
  theme: light
  # 底部状态栏（CPU / GPU / 内存利用率 + 压力着色）
  status_bar:
    # 采样与刷新间隔（毫秒）：250~10000。500 以下差分类计数器读数会明显抖动
    refresh_interval_ms: 1000
    # 利用率 → 颜色的渐变锚点（0~100），三个指标共用一套；数量不限，位置不可重复
    # 相邻锚点之间线性插值，状态栏取色与设置页预览用的是同一份锚点
    gradient_stops:
    - at: 0.0
      color: '#17A05E'
    - at: 50.0
      color: '#E0A008'
    - at: 80.0
      color: '#D94A4A'
    - at: 100.0
      color: '#D94A4A'
